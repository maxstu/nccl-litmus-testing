name: Host barrier after synchronised receive
description: |
  Rank 1 receives rank 0's value 7 into buffer 1, synchronises stream 0 and joins rank 0 at a host
  barrier.
  It then forwards buffer 1 to rank 2 on stream 1, giving 7 in both receive destinations while
  preserving other buffers.
required_gpus: 3
buffers_per_gpu: 2
streams_per_gpu: 2
buffer_size: 1
communicators:
- [0, 1, 2]
program: |
  thread {
      send<0,1>[0](0,0,float,1);
      barrier({0,1});
  }
  thread {
      recv<1,0>[1](0,0,float,1);
      sync(1,0);
      barrier({0,1});
      send<1,2>[1](0,1,float,1);
  }
  thread {
      recv<2,1>[0](0,1,float,1);
  }
initial_values:
- [7, 3]
- [5, 0]
- [0, 11]
acceptable_results:
- - [7, 3]
  - [5, 7]
  - [7, 11]
