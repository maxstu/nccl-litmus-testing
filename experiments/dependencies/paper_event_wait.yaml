name: Host event wait before cross-stream forwarding
description: |
  Rank 1 records an event after receiving scalar 7 from rank 0 on stream 0.
  Its host thread waits for that event before sending on stream 1 to rank 2, leaving all buffers
  at 7.
required_gpus: 3
buffers_per_gpu: 1
streams_per_gpu: 2
buffer_size: 1
communicators:
- [0, 1, 2]
program: |
  thread { send<0,1>[0](0,0,float,buffer_size); }
  thread {
      recv<1,0>[0](0,0,float,buffer_size);
      event(1,0,17);
      wait(1,0,17);
      send<1,2>[0](0,1,float,buffer_size);
  }
  thread { recv<2,1>[0](0,1,float,buffer_size); }
initial_values:
- [7]
- [0]
- [0]
acceptable_results:
- - [7]
  - [7]
  - [7]
iterations: 100
elementwise_results:
- [7]
- [7]
- [7]
