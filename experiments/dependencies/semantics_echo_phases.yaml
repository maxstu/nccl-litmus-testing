name: 'Semantics: echo across singleton phases'
description: |
  One thread per rank issues the two scalar echo calls separately on stream 0, using the same
  buffer for receiving and sending.
  Completion of the forward transfer precedes the dependent echo, leaving both rank buffers at 7.
required_gpus: 2
buffers_per_gpu: 1
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
program: |
  thread {
      send<0,1>[0](0,0,int,buffer_size);
      recv<0,1>[0](0,0,int,buffer_size);
  }
  thread {
      recv<1,0>[0](0,0,int,buffer_size);
      send<1,0>[0](0,0,int,buffer_size);
  }
initial_values:
- [7]
- [0]
acceptable_results:
- - [7]
  - [7]
