name: In-place Collective Consistency
description: |
  Separate rank-owning threads sum inputs 1 and 2 on stream 0.
  Rank 0 reduces in place, while rank 1 writes buffer 1 and preserves its source, giving rank
  states [3,0] and [2,3].
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
program: |
  thread {
      allReduce<0>[0,0](0,0,sum,float,1);
  }
  thread {
      allReduce<1>[0,1](0,0,sum,float,1);
  }
initial_values:
- [1, 0]
- [2, 0]
acceptable_results:
- - - [3]
    - [0]
  - - [2]
    - [3]
