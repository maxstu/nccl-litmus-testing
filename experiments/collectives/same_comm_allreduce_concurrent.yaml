name: 'Same-communicator AllReduce: concurrent host calls'
description: |
  Four host threads issue two in-place all-reduces per rank on one communicator and stream, using
  distinct buffers initially containing 1.
  Concurrent calls to the same communicator object violate its thread-safety requirement and have
  undefined behaviour.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 1024
communicators:
- [0, 1]
program: |
  thread { allReduce<0>[0,0](0,0,sum,float,buffer_size); }
  thread { allReduce<0>[1,1](0,0,sum,float,buffer_size); }
  thread { allReduce<1>[0,0](0,0,sum,float,buffer_size); }
  thread { allReduce<1>[1,1](0,0,sum,float,buffer_size); }
initial_values:
- [1, 1]
- [1, 1]
expected_undefined_behaviour: true
