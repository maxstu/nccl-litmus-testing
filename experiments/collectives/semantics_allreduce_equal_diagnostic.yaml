name: 'Semantics: allreduce equal diagnostic'
description: |
  Two rank-owning threads perform an in-place sum all-reduce on equal scalar inputs 7 and 7.
  The expected result is 14 at both ranks; a set-based reduction that discards duplicate
  contributions instead predicts 7.
required_gpus: 2
buffers_per_gpu: 1
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
program: |
  thread {
      allReduce<0>[0,0](0,0,sum,float,buffer_size);
  }
  thread {
      allReduce<1>[0,0](0,0,sum,float,buffer_size);
  }
initial_values:
- [7]
- [7]
acceptable_results:
- - [14]
  - [14]
