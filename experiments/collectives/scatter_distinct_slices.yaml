name: Scatter distinct rank slices
description: |
  A gather prepares [7,3] at rank 0, which synchronises stream 0 before scattering one element per
  rank.
  The destinations become [7,-2] and [3,-2], preserving input buffers and the prepared root array.
required_gpus: 2
buffers_per_gpu: 3
streams_per_gpu: 1
buffer_size: 2
communicators:
- [0, 1]
program: |
  thread {
      gatherRoot<0>[0,1](0,0,float,1);
      sync(0,0);
      scatterRoot<0>[1,2](0,0,float,1);
  }
  thread {
      gatherPeer<1,0>[0](0,0,float,1);
      scatterPeer<1,0>[2](0,0,float,1);
  }
initial_values:
- [7, -1, -2]
- [3, -1, -2]
acceptable_results:
- - - 7
    - [7, 3]
    - [7, -2]
  - - 3
    - -1
    - [3, -2]
elementwise_results:
- - [7, 7]
  - [7, 3]
  - [7, -2]
- - [3, 3]
  - [-1, -1]
  - [3, -2]
