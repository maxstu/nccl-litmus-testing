name: 'Semantics: collective order aligned'
description: |
  One thread per rank issues a sum on buffer 0 followed by a product on buffer 1, using separate
  calls on stream 0.
  Both ranks finish at [10,6].
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
program: |
  thread {
      allReduce<0>[0,0](0,0,sum,float,buffer_size);
      allReduce<0>[1,1](0,0,product,float,buffer_size);
  }
  thread {
      allReduce<1>[0,0](0,0,sum,float,buffer_size);
      allReduce<1>[1,1](0,0,product,float,buffer_size);
  }
initial_values:
- [7, 2]
- [3, 3]
acceptable_results:
- - [10, 6]
  - [10, 6]
