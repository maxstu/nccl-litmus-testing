name: 'Semantics: alltoall values'
description: |
  Each rank all-to-alls one element per peer from a uniform source array, containing 7 at rank 0
  and 3 at rank 1.
  Both destinations are exactly [7,3], with sources unchanged.
  Uniform source segments test sender order but do not distinguish destination-slice selection.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 2
communicators:
- [0, 1]
program: |
  thread {
      allToAll<0>[0,1](0,0,float,1);
  }
  thread {
      allToAll<1>[0,1](0,0,float,1);
  }
initial_values:
- [7, 0]
- [3, 0]
acceptable_results:
- - - 7
    - [7, 3]
  - - 3
    - [7, 3]
elementwise_results:
- - [7, 7]
  - [7, 3]
- - [3, 3]
  - [7, 3]
