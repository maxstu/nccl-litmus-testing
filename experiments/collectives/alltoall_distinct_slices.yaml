name: AllToAll distinct destination slices
description: |
  Each rank all-gathers inputs 7 and 3 into buffer 1 and synchronises stream 0 before using that
  buffer in an all-to-all.
  Destination-indexed selection gives rank-0 output [7,7] and rank-1 output [3,3], preserving the
  prepared [7,3] arrays and original sources.
required_gpus: 2
buffers_per_gpu: 3
streams_per_gpu: 1
buffer_size: 2
communicators:
- [0, 1]
program: |
  thread {
      allGather<0>[0,1](0,0,float,1);
      sync(0,0);
      allToAll<0>[1,2](0,0,float,1);
  }
  thread {
      allGather<1>[0,1](0,0,float,1);
      sync(1,0);
      allToAll<1>[1,2](0,0,float,1);
  }
initial_values:
- [7, -1, -2]
- [3, -1, -2]
acceptable_results:
- - - 7
    - [7, 3]
    - 7
  - - 3
    - [7, 3]
    - 3
elementwise_results:
- - [7, 7]
  - [7, 3]
  - [7, 7]
- - [3, 3]
  - [7, 3]
  - [3, 3]
