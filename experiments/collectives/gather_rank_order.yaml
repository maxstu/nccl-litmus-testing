name: Gather rank order and root-only output
description: |
  Separate threads gather one element from inputs 7 and 3 to rank 0 on stream 0.
  The root destination is exactly [7,3]; both sources and the non-root destination remain
  unchanged.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 2
communicators:
- [0, 1]
program: |
  thread {
      gatherRoot<0>[0,1](0,0,float,1);
  }
  thread {
      gatherPeer<1,0>[0](0,0,float,1);
  }
initial_values:
- [7, -1]
- [3, -1]
acceptable_results:
- - - 7
    - [7, 3]
  - [3, -1]
elementwise_results:
- - [7, 7]
  - [7, 3]
- - [3, 3]
  - [-1, -1]
