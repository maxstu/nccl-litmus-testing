name: allreduce sum control
description: |
  Two rank-owning threads issue matching out-of-place sum all-reduces over four elements on stream
  0.
  Both output buffers contain 10, while source buffers retain 7 and 3.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 4
iterations: 10000
communicators:
- [0, 1]
program: |
  thread {
      allReduce<0>[0,1](0,0,sum,float,4);
  }
  thread {
      allReduce<1>[0,1](0,0,sum,float,4);
  }
initial_values:
- [7, -1]
- [3, -1]
acceptable_results:
- - - [7]
    - [10]
  - - [3]
    - [10]
