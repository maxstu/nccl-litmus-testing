name: 'Semantics: allreduce distinct'
description: |
  Two rank-owning threads perform an in-place sum all-reduce on distinct scalar inputs 7 and 3
  using stream 0.
  Both buffers finish at 10.
required_gpus: 2
buffers_per_gpu: 1
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
program: |
  thread {
      allReduce<0>[0,0](0,0,sum,float,buffer_size);
  }
  thread {
      allReduce<1>[0,0](0,0,sum,float,buffer_size);
  }
initial_values:
- [7]
- [3]
acceptable_results:
- - [10]
  - [10]
