name: Group exit dependency with reductions
description: |
  Each rank groups two independent reductions on streams 0 and 1, then issues a stream-1 reduction
  that reads the stream-0 result.
  The group-exit dependency orders that consumer, giving output buffers [4,6,8] at both ranks.
required_gpus: 2
buffers_per_gpu: 5
streams_per_gpu: 2
buffer_size: 1024
communicators:
- [0, 1]
initial_values:
- [1, 2, 0, 0, 0]
- [3, 4, 0, 0, 0]
acceptable_results:
- - [1, 2, 4, 6, 8]
  - [3, 4, 4, 6, 8]
program: |
  thread {
      group {
          allReduce<0>[0,2](0,0,sum,float,buffer_size);
          allReduce<0>[1,3](0,1,sum,float,buffer_size);
      };
      allReduce<0>[2,4](0,1,sum,float,buffer_size);
  }
  thread {
      group {
          allReduce<1>[0,2](0,0,sum,float,buffer_size);
          allReduce<1>[1,3](0,1,sum,float,buffer_size);
      };
      allReduce<1>[2,4](0,1,sum,float,buffer_size);
  }
