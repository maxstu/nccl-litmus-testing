name: Group entry dependency with reductions
description: |
  A stream-0 sum first writes buffer 2 at each rank, followed by a group containing an independent
  stream-0 sum and a stream-1 sum that reads buffer 2.
  The intended group-entry dependency orders that consumer after its producer, giving output
  buffers [4,6,8] at both ranks.
  The written transition rules still need to account for this entry join.
required_gpus: 2
buffers_per_gpu: 5
streams_per_gpu: 2
buffer_size: 1
communicators:
- [0, 1]
initial_values:
- [1, 2, 0, 0, 0]
- [3, 4, 0, 0, 0]
program: |
  thread {
      allReduce<0>[0,2](0,0,sum,float,1);
      group {
          allReduce<0>[1,3](0,0,sum,float,1);
          allReduce<0>[2,4](0,1,sum,float,1);
      }
  }
  thread {
      allReduce<1>[0,2](0,0,sum,float,1);
      group {
          allReduce<1>[1,3](0,0,sum,float,1);
          allReduce<1>[2,4](0,1,sum,float,1);
      }
  }
acceptable_results:
- - [1, 2, 4, 6, 8]
  - [3, 4, 4, 6, 8]
