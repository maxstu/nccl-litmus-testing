name: Single-thread broadcast with group
description: |
  One host thread groups both rank calls for a broadcast on stream 0.
  Rank 0's initial value 42 is copied to rank 1, leaving both buffers at 42.
required_gpus: 2
buffers_per_gpu: 1
streams_per_gpu: 1
buffer_size: 128
communicators:
- [0, 1]
program: |
  thread {
    group {
      broadcastRoot<0>[0,0](0,0,int,buffer_size);
      broadcastPeer<1,0>[0](0,0,int,buffer_size);
    }
  }
initial_values:
- [42]
- [0]
acceptable_results:
- - - [42]
  - - [42]
