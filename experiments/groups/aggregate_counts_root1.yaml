name: 'NCCL Tests candidate: Grouped operations with different counts and roots'
description: |
  Each rank groups a one-element broadcast from root 1 and a two-element sum reduction on stream 0
  using distinct buffers.
  The broadcast writes 5 and the sum writes 10 into their designated prefixes.
  Elementwise checks preserve all source values and unwritten suffix sentinels.
required_gpus: 2
buffers_per_gpu: 4
streams_per_gpu: 1
buffer_size: 4
iterations: 100
communicators:
- [0, 1]
initial_values:
- [42, 7, -1, -2]
- [5, 3, -3, -4]
acceptable_results:
- - - 42
    - 7
    - [5, -1]
    - [10, -2]
  - - 5
    - 3
    - [5, -3]
    - [10, -4]
elementwise_results:
- - 42
  - 7
  - [5, -1, -1, -1]
  - [10, 10, -2, -2]
- - 5
  - 3
  - [5, -3, -3, -3]
  - [10, 10, -4, -4]
program: |
  thread { group {
      broadcastPeer<0,1>[2](0,0,float,1);
      allReduce<0>[1,3](0,0,sum,float,2);
  } }
  thread { group {
      broadcastRoot<1>[0,2](0,0,float,1);
      allReduce<1>[1,3](0,0,sum,float,2);
  } }
