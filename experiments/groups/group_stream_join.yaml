required_gpus: 2
buffers_per_gpu: 6
streams_per_gpu: 2
buffer_size: 1
communicators:
- [0, 1]
initial_values:
- [-7, -2, -1, -2, -3, -4]
- [-3, -3, -5, -6, -7, -8]
acceptable_results:
- - [7, 2, 10, 5, 10, 5]
  - [3, 3, 10, 5, 10, 5]
program: |
  thread {
      fill<0,1>[0](float,buffer_size,7,1000000);
      fill<0,0>[1](float,buffer_size,2,1000000);
      group {
          allReduce<0>[0,2](0,0,sum,float,buffer_size);
          allReduce<0>[1,3](0,1,sum,float,buffer_size);
      };
      copy<0,1>[2,4](float,buffer_size);
      copy<0,0>[3,5](float,buffer_size);
  }
  thread {
      fill<1,1>[0](float,buffer_size,3,1000000);
      fill<1,0>[1](float,buffer_size,3,1000000);
      group {
          allReduce<1>[0,2](0,0,sum,float,buffer_size);
          allReduce<1>[1,3](0,1,sum,float,buffer_size);
      };
      copy<1,1>[2,4](float,buffer_size);
      copy<1,0>[3,5](float,buffer_size);
  }
name: 'NCCL Tests candidate: Cross-stream group entry and exit dependencies'
description: |
  Delayed CUDA fills prepare two inputs on opposite streams before each rank groups two reductions
  on streams 0 and 1.
  Cross-stream copies after the group consume the reduction outputs.
  Group entry and exit dependencies give reductions and copies of 10 and 5; the delay supplies
  stress rather than synchronisation.
iterations: 100
elementwise_results:
- [7, 2, 10, 5, 10, 5]
- [3, 3, 10, 5, 10, 5]
