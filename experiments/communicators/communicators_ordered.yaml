required_gpus: 2
buffers_per_gpu: 4
streams_per_gpu: 2
buffer_size: 1
communicators:
- [0, 1]
- [0, 1]
initial_values:
- [7, 2, -1, -2]
- [3, 3, -3, -4]
acceptable_results:
- - [7, 2, 10, 6]
  - [3, 3, 10, 6]
program: |
  thread {
      allReduce<0>[0,2](0,0,sum,float,buffer_size);
      sync(0,0);
      allReduce<0>[1,3](1,1,product,float,buffer_size);
  }
  thread {
      allReduce<1>[0,2](0,0,sum,float,buffer_size);
      sync(1,0);
      allReduce<1>[1,3](1,1,product,float,buffer_size);
  }
name: 'NCCL Tests candidate: Overlapping communicator routing with explicit launch
  order'
description: |
  Each rank sums on communicator 0 using stream 0, synchronises that stream, then multiplies on
  communicator 1 using stream 1.
  Separate buffers preserve the sources and receive outputs 10 and 6.
iterations: 100
elementwise_results:
- [7, 2, 10, 6]
- [3, 3, 10, 6]
