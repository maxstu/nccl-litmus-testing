name: Multi-Clique Grouping
description: |
  One host group reduces in place on cliques [0,1] and [0,2], with the shared rank 0 using
  different streams.
  Both reductions read and write rank 0 buffer 0 without a completion dependency, giving undefined
  behaviour.
iterations: 1
buffer_size: 1024
required_gpus: 3
buffers_per_gpu: 2
streams_per_gpu: 2
communicators:
- [0, 1]
- [0, 2]
program: |
  group {
      allReduce<0>[0,0](0,0,sum,float,buffer_size);
      allReduce<1>[0,0](0,0,sum,float,buffer_size);
      allReduce<0>[0,0](1,1,sum,float,buffer_size);
      allReduce<2>[0,0](1,0,sum,float,buffer_size);
  };
initial_values:
- [1.0, 0]
- [1.0, 0]
- [1.0, 0]
expected_undefined_behaviour: true
