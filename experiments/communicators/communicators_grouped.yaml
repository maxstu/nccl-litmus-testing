required_gpus: 2
buffers_per_gpu: 4
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
- [0, 1]
initial_values:
- [7, 2, -1, -2]
- [3, 3, -3, -4]
acceptable_results:
- - [7, 2, 10, 6]
  - [3, 3, 10, 6]
program: |
  thread { group {
      allReduce<0>[0,2](0,0,sum,float,buffer_size);
      allReduce<0>[1,3](1,0,product,float,buffer_size);
  } }
  thread { group {
      allReduce<1>[0,2](0,0,sum,float,buffer_size);
      allReduce<1>[1,3](1,0,product,float,buffer_size);
  } }
name: 'NCCL Tests candidate: Overlapping communicator routing in a same-stream ordered
  group'
description: |
  Each rank groups a sum on communicator 0 and a product on communicator 1 using stream 0 and
  disjoint source/output buffers.
  Matching order gives outputs 10 and 6 at both ranks while preserving sources.
iterations: 100
elementwise_results:
- [7, 2, 10, 6]
- [3, 3, 10, 6]
