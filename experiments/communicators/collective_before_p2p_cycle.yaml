name: Collective before P2P dependency cycle
description: |
  Rank 0 groups a sum reduction followed by a separate-buffer send on another communicator, while
  rank 1 receives before reducing on the same stream.
  The grouped send can release the receive dependency, giving sum outputs 10 and received value
  11.
  The written global rank-admission guard can obstruct this intended progress and needs
  reconciliation.
required_gpus: 2
buffers_per_gpu: 3
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
- [0, 1]
program: |
  thread {
    group {
      allReduce<0>[0,1](0,0,sum,float,1);
      send<0,1>[2](1,0,float,1);
    }
  }
  thread {
    recv<1,0>[2](1,0,float,1);
    allReduce<1>[0,1](0,0,sum,float,1);
  }
initial_values:
- [7, 0, 11]
- [3, 0, 0]
acceptable_results:
- - [7, 10, 11]
  - [3, 10, 11]
