name: Streams survive communicator deadlock
description: |
  Two rank-owning threads issue incompatible scatter and gather calls on communicator 0, followed
  by a broadcast on communicator 1 using the same streams.
  The collective-kind mismatch gives whole-program undefined behaviour, including the later
  broadcast.
iterations: 200
buffer_size: 2048
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
communicators:
- [0, 1]
- [0, 1]
program: |
  thread {
      scatterRoot<0>[0,0](0,0,float,1024);
      broadcastRoot<0>[1,1](1,0,float,1024);
  }
  thread {
      gatherRoot<1>[0,0](0,0,float,1024);
      broadcastPeer<1,0>[1](1,0,float,1024)
  }
initial_values:
- [0, 0]
- [1, 0]
expected_undefined_behaviour: true
