name: Reversed grouped collective order across communicators
description: |
  One thread per rank groups a sum and a product on two distinct communicators with separate
  buffers, using stream 0.
  Rank 1 reverses the two collective calls, violating matching collective order and giving
  undefined behaviour.
required_gpus: 2
buffers_per_gpu: 4
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
- [0, 1]
initial_values:
- [7, 2, -1, -2]
- [3, 3, -3, -4]
program: |
  thread { group {
      allReduce<0>[0,2](0,0,sum,float,buffer_size);
      allReduce<0>[1,3](1,0,product,float,buffer_size);
  } }
  thread { group {
      allReduce<1>[1,3](1,0,product,float,buffer_size);
      allReduce<1>[0,2](0,0,sum,float,buffer_size);
  } }
iterations: 100
expected_undefined_behaviour: true
