name: Grouped reductions on overlapping cliques
description: |
  One host group reduces in place on cliques [0,1] and [1,2], using stream 0 at each rank.
  Both reductions access rank 1 buffer 0 without a completion dependency, giving undefined
  behaviour despite their same-stream placement within the group.
iterations: 1
buffer_size: 1024
required_gpus: 3
buffers_per_gpu: 2
streams_per_gpu: 2
communicators:
- [0, 1]
- [1, 2]
program: |
  group {
      allReduce<0>[0,0](0,0,sum,float,buffer_size);
      allReduce<1>[0,0](0,0,sum,float,buffer_size);
      allReduce<1>[0,0](1,0,sum,float,buffer_size);
      allReduce<2>[0,0](1,0,sum,float,buffer_size);
  };
initial_values:
- [1.0, 0]
- [1.0, 0]
- [1.0, 0]
expected_undefined_behaviour: true
