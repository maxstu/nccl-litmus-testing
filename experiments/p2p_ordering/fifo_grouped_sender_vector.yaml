name: 'NCCL Tests candidate: Elementwise same-peer FIFO with 128-element messages'
description: |
  Rank 0 groups sends from two uniform 128-element buffers on stream 0, while rank 1 issues
  separate receives into distinct buffers on stream 0.
  Every element of the receive buffers becomes 7 and 3 respectively, with source arrays unchanged.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 128
communicators:
- [0, 1]
program: |
  thread {
      group {
          send<0,1>[0](0,0,float,buffer_size);
          send<0,1>[1](0,0,float,buffer_size);
      }
  }
  thread {
      recv<1,0>[0](0,0,float,buffer_size);
      recv<1,0>[1](0,0,float,buffer_size);
  }
initial_values:
- [7, 3]
- [0, 5]
acceptable_results:
- - [7, 3]
  - [7, 3]
iterations: 100
elementwise_results:
- [7, 3]
- [7, 3]
