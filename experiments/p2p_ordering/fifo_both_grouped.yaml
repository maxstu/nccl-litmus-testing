name: 'NCCL Tests candidate: Same-peer FIFO with both endpoints grouped'
description: |
  One thread per rank groups two same-peer scalar sends or receives on stream 0, using distinct
  buffers.
  Rank 1 receives [7,3] in source order while rank 0's sources remain unchanged.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
program: |
  thread { group {
      send<0,1>[0](0,0,float,buffer_size);
      send<0,1>[1](0,0,float,buffer_size);
  } }
  thread { group {
      recv<1,0>[0](0,0,float,buffer_size);
      recv<1,0>[1](0,0,float,buffer_size);
  } }
initial_values:
- [7, 3]
- [0, 5]
acceptable_results:
- - [7, 3]
  - [7, 3]
iterations: 100
elementwise_results:
- [7, 3]
- [7, 3]
