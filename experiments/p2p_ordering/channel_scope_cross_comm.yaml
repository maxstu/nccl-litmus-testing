name: 'Channel scope: cross_comm'
description: |
  One thread per rank groups two same-peer transfers on different streams and distinct
  communicators with membership [0,1].
  Both receives overwrite rank 1 buffer 1 without a completion dependency, giving undefined
  behaviour.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 2
buffer_size: 262144
communicators:
- &id001 [0, 1]
- *id001
program: |
  thread {
    group {
      send<0,1>[0](0,0,float,buffer_size);
      send<0,1>[1](1,1,float,buffer_size);
    }
  }
  thread {
    group {
      recv<1,0>[1](0,0,float,buffer_size);
      recv<1,0>[1](1,1,float,buffer_size);
    }
  }
initial_values:
- [7, 3]
- [0, 0]
iterations: 100
expected_undefined_behaviour: true
