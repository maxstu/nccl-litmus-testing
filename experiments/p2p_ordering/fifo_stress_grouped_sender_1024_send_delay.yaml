name: 'Cross-stream FIFO stress: grouped_sender, 1024 floats, send_delay'
description: |
  Rank 0 groups eight disjoint 1024-element sends alternating streams 1 and 0, while rank 1
  receives into distinct buffers through separate stream-0 calls.
  A delayed zero fill touches only sender scratch buffer 8.
  The oracle permits 70 complete pairings consistent with sender per-stream FIFO and receiver call
  order, preserving sources and scratch zero.
  Stronger cross-stream ordering remains unresolved pending NVIDIA clarification.
required_gpus: 2
buffers_per_gpu: 9
streams_per_gpu: 2
buffer_size: 1024
communicators:
- [0, 1]
program: |
  thread {
    fill<0,1>[8](float,1,0,10000000);
    group {
      send<0,1>[0](0,1,float,buffer_size);
      send<0,1>[1](0,0,float,buffer_size);
      send<0,1>[2](0,1,float,buffer_size);
      send<0,1>[3](0,0,float,buffer_size);
      send<0,1>[4](0,1,float,buffer_size);
      send<0,1>[5](0,0,float,buffer_size);
      send<0,1>[6](0,1,float,buffer_size);
      send<0,1>[7](0,0,float,buffer_size);
    }
  }
  thread {
    recv<1,0>[0](0,0,float,buffer_size);
    recv<1,0>[1](0,0,float,buffer_size);
    recv<1,0>[2](0,0,float,buffer_size);
    recv<1,0>[3](0,0,float,buffer_size);
    recv<1,0>[4](0,0,float,buffer_size);
    recv<1,0>[5](0,0,float,buffer_size);
    recv<1,0>[6](0,0,float,buffer_size);
    recv<1,0>[7](0,0,float,buffer_size);
  }
initial_values:
- [7, 3, 11, 19, 23, 31, 43, 59, 0]
- [-1, -2, -3, -4, -5, -6, -7, -8, 0]
