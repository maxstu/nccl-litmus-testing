name: Grouped P2P with same target rank
description: |
  One host group sends values 1 and 2 from ranks 1 and 2 into rank 0 buffer 0 on stream 0.
  Different-peer channels supply no completion dependency between the overlapping writes, giving
  undefined behaviour.
buffer_size: 1024
required_gpus: 3
buffers_per_gpu: 1
streams_per_gpu: 1
communicators:
- [0, 1, 2]
program: |
  group {
      send<1,0>[0](0,0,float,buffer_size);
      recv<0,1>[0](0,0,float,buffer_size);
      send<2,0>[0](0,0,float,buffer_size);
      recv<0,2>[0](0,0,float,buffer_size);
  }
initial_values:
- [0]
- [1]
- [2]
expected_undefined_behaviour: true
