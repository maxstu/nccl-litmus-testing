name: P2P with a broadcast in the middle
buffer_size: 1024
required_gpus: 2
buffers_per_gpu: 3
streams_per_gpu: 1
communicators:
- [0, 1]
program: |
  thread {
      group {
          send<0,1>[0](0,0,int,buffer_size);
          broadcastRoot<0>[2,2](0,0,int,buffer_size);
          recv<0,1>[1](0,0,int,buffer_size);
      }
  }
  thread {
      group {
          send<1,0>[0](0,0,int,buffer_size);
          broadcastPeer<1,0>[2](0,0,int,buffer_size);
          recv<1,0>[1](0,0,int,buffer_size);
      }
  }
initial_values:
- [0, 2, 4]
- [1, 3, 5]
acceptable_results:
- - - [0]
    - [1]
    - [4]
  - - [1]
    - [0]
    - [4]
description: |
  Each rank groups a send, an independent-buffer broadcast and a receive on stream 0.
  The opposing source values are copied into the receive buffers, while the broadcast copies 4
  into both buffer-2 destinations.
