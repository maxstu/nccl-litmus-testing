name: P2P data transfer in a ring
description: |
  Three rank-owning threads each group a send to the next rank and a receive from the previous
  rank on stream 0.
  Distinct sources 7, 42 and 153 give receive buffers 153, 7 and 42 at ranks 0, 1 and 2, with
  sources preserved.
required_gpus: 3
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 128
communicators:
- [0, 1, 2]
program: |
  thread {
      group {
          send<0,1>[0](0,0,int,buffer_size);
          recv<0,2>[1](0,0,int,buffer_size);
      }
  }
  thread {
      group {
          send<1,2>[0](0,0,int,buffer_size);
          recv<1,0>[1](0,0,int,buffer_size);
      }
  }
  thread {
      group {
          send<2,0>[0](0,0,int,buffer_size);
          recv<2,1>[1](0,0,int,buffer_size);
      }
  }
initial_values:
- [7, 0]
- [42, 0]
- [153, 0]
acceptable_results:
- - - [7]
    - [153]
  - - [42]
    - [7]
  - - [153]
    - [42]
