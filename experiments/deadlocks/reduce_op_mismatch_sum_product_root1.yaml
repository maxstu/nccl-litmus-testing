name: reduce op mismatch sum product root1
description: |
  Two rank-owning threads issue a four-element reduction to root 1 on stream 0 using inputs 7 and
  3.
  Rank 0 requests sum and rank 1 requests product, so the collective has incompatible reduction
  functions and undefined behaviour.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 4
iterations: 10000
communicators:
- [0, 1]
program: |
  thread {
      reducePeer<0,1>[0](0,0,sum,float,4);
  }
  thread {
      reduceRoot<1>[0,1](0,0,product,float,4);
  }
initial_values:
- [7, -1]
- [3, -1]
expected_undefined_behaviour: true
