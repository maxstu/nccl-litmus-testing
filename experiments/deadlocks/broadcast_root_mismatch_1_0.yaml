name: broadcast root mismatch 1 0
description: |
  Two rank-owning threads issue a four-element broadcast on stream 0, with each naming the other
  rank as root.
  Each rank issues only a peer call into buffer 1.
  The inconsistent root declarations give undefined behaviour.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 4
iterations: 10000
communicators:
- [0, 1]
program: |
  thread {
      broadcastPeer<0,1>[1](0,0,float,4);
  }
  thread {
      broadcastPeer<1,0>[1](0,0,float,4);
  }
initial_values:
- [7, -1]
- [3, -1]
expected_undefined_behaviour: true
