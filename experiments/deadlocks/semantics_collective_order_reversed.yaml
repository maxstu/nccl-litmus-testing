name: 'Semantics: collective order reversed'
description: |
  One thread per rank issues a sum on buffer 0 and a product on buffer 1 as separate stream-0
  calls, but rank 1 reverses their order.
  The inconsistent collective order gives undefined behaviour.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
program: |
  thread {
      allReduce<0>[0,0](0,0,sum,float,buffer_size);
      allReduce<0>[1,1](0,0,product,float,buffer_size);
  }
  thread {
      allReduce<1>[1,1](0,0,product,float,buffer_size);
      allReduce<1>[0,0](0,0,sum,float,buffer_size);
  }
initial_values:
- [7, 2]
- [3, 3]
expected_undefined_behaviour: true
