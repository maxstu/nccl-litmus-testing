name: 'Semantics: collective op mismatch'
description: |
  Two rank-owning threads issue scalar in-place all-reduces on stream 0, with rank 0 requesting
  sum and rank 1 requesting product.
  The incompatible reduction functions give undefined behaviour.
required_gpus: 2
buffers_per_gpu: 1
streams_per_gpu: 1
buffer_size: 1
communicators:
- [0, 1]
program: |
  thread {
      allReduce<0>[0,0](0,0,sum,float,buffer_size);
  }
  thread {
      allReduce<1>[0,0](0,0,product,float,buffer_size);
  }
initial_values:
- [7]
- [3]
expected_undefined_behaviour: true
