name: P2P transfer with no group
buffer_size: 1024
required_gpus: 2
buffers_per_gpu: 1
streams_per_gpu: 1
communicators:
- [0, 1]
program: |
  send<0,1>[0](0,0,float,buffer_size);
  recv<1,0>[0](0,0,float,buffer_size);
initial_values:
- [0]
- [1]
expected_deadlock: true
description: |
  One host thread issues an ungrouped send from rank 0 followed by its matching rank-1 receive.
  The test expects an execution stall if the send waits before the thread can issue its partner.
