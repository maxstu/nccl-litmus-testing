name: Collective communicator mismatch
description: |
  Two rank-owning threads issue four-element sum all-reduces on different communicators with
  identical membership [0,1].
  Each communicator lacks a participant, producing a stuck collective and whole-program undefined
  behaviour.
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
buffer_size: 4
communicators:
- [0, 1]
- [0, 1]
program: |
  thread {
      allReduce<0>[0,1](0,0,sum,float,4);
  }
  thread {
      allReduce<1>[0,1](1,0,sum,float,4);
  }
initial_values:
- [7, -1]
- [3, -1]
expected_undefined_behaviour: true
