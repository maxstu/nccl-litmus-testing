name: Mismatched groups on separate threads
buffer_size: 1024
required_gpus: 2
buffers_per_gpu: 2
streams_per_gpu: 1
communicators:
- [0, 1]
program: |
  thread {
      group {
          broadcastRoot<0>[0,0](0,0,float,buffer_size);
          broadcastRoot<1>[1,1](0,0,float,buffer_size)
      }
  }
  thread {
      group {
          broadcastRoot<1>[1,1](0,0,float,buffer_size);
          broadcastRoot<0>[0,0](0,0,float,buffer_size)
      }
  }
initial_values:
- [0, 2]
- [1, 3]
expected_undefined_behaviour: true
description: |
  Two host threads each group broadcasts that declare rank 0 and rank 1 as roots, listing the
  calls in opposite orders on one communicator and stream.
  The incompatible root declarations and competing grouped issuance have undefined behaviour.
